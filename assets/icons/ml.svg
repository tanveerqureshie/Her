<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="ml-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="ml-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="20" fill="#18181b"/>
  <!-- Synapse Lines -->
  <g stroke="url(#ml-grad)" stroke-width="2.5" opacity="0.6">
    <line x1="28" y1="38" x2="64" y2="28"/>
    <line x1="28" y1="38" x2="64" y2="64"/>
    <line x1="28" y1="64" x2="64" y2="28"/>
    <line x1="28" y1="64" x2="64" y2="64"/>
    <line x1="28" y1="64" x2="64" y2="100"/>
    <line x1="28" y1="90" x2="64" y2="64"/>
    <line x1="28" y1="90" x2="64" y2="100"/>
    
    <line x1="64" y1="28" x2="100" y2="48"/>
    <line x1="64" y1="64" x2="100" y2="48"/>
    <line x1="64" y1="64" x2="100" y2="80"/>
    <line x1="64" y1="100" x2="100" y2="80"/>
  </g>
  <!-- Input Layer Nodes -->
  <circle cx="28" cy="38" r="8" fill="#8b5cf6"/>
  <circle cx="28" cy="64" r="8" fill="#8b5cf6"/>
  <circle cx="28" cy="90" r="8" fill="#8b5cf6"/>
  <!-- Hidden Layer Nodes -->
  <circle cx="64" cy="28" r="9" fill="url(#ml-grad)"/>
  <circle cx="64" cy="64" r="9" fill="url(#ml-grad)"/>
  <circle cx="64" cy="100" r="9" fill="url(#ml-grad)"/>
  <!-- Output Layer Nodes -->
  <circle cx="100" cy="48" r="8" fill="#06b6d4"/>
  <circle cx="100" cy="80" r="8" fill="#06b6d4"/>
  <!-- Pulses -->
  <circle cx="64" cy="64" r="3" fill="#ffffff"/>
  <circle cx="100" cy="48" r="3" fill="#ffffff"/>
</svg>
