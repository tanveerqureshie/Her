<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110e1b"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bg-p2)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#2e1065" stroke-width="1" opacity="0.25">
    <circle cx="400" cy="240" r="180" fill="none"/>
    <circle cx="400" cy="240" r="320" fill="none"/>
  </g>

  <!-- Frame Header -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#181329" stroke="#3b2d54" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="12" fill="#241b3d"/>
  <circle cx="65" cy="51" r="5.5" fill="#ef4444"/>
  <circle cx="85" cy="51" r="5.5" fill="#f59e0b"/>
  <circle cx="105" cy="51" r="5.5" fill="#10b981"/>
  <text x="400" y="56" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">agenticflow-studio :: orchestration_graph.rag.ts</text>

  <!-- Node 1: User Intent Router -->
  <rect x="80" y="200" width="160" height="90" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="2"/>
  <text x="160" y="235" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Intent Router</text>
  <text x="160" y="260" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">LLM Semantic Parse</text>
  
  <!-- Connecting Beam 1 -->
  <path d="M240 245 L320 160" stroke="url(#purple-glow)" stroke-width="2.5" stroke-dasharray="4 2"/>
  <path d="M240 245 L320 330" stroke="url(#purple-glow)" stroke-width="2.5" stroke-dasharray="4 2"/>

  <!-- Node 2: Vector RAG Search -->
  <rect x="320" y="115" width="170" height="90" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="405" y="150" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Vector RAG Node</text>
  <text x="405" y="175" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Pinecone Embeddings</text>

  <!-- Node 3: Python Tool Execution -->
  <rect x="320" y="285" width="170" height="90" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
  <text x="405" y="320" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Tool Executor</text>
  <text x="405" y="345" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Python REPL Sandbox</text>

  <!-- Connecting Beam 2 -->
  <path d="M490 160 L570 245" stroke="url(#purple-glow)" stroke-width="2.5"/>
  <path d="M490 330 L570 245" stroke="url(#purple-glow)" stroke-width="2.5"/>

  <!-- Node 4: Synthesis & Output -->
  <rect x="570" y="200" width="160" height="90" rx="10" fill="#3b0764" stroke="#d946ef" stroke-width="2"/>
  <text x="650" y="235" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Synthesizer Agent</text>
  <text x="650" y="260" fill="#f0abfc" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Structured Output</text>

  <!-- Status Indicator -->
  <rect x="290" y="405" width="220" height="30" rx="15" fill="#2e1065" stroke="#c084fc" stroke-width="1"/>
  <circle cx="310" cy="420" r="4.5" fill="#10b981"/>
  <text x="410" y="425" fill="#e9d5ff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Pipeline: Latency 142ms</text>
</svg>
