<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a12"/>
      <stop offset="100%" stop-color="#050205"/>
    </linearGradient>
    <radialGradient id="heat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bg-p4)"/>

  <!-- Frame Header -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#180c16" stroke="#371b32" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="12" fill="#2b1427"/>
  <circle cx="65" cy="51" r="5.5" fill="#ef4444"/>
  <circle cx="85" cy="51" r="5.5" fill="#f59e0b"/>
  <circle cx="105" cy="51" r="5.5" fill="#10b981"/>
  <text x="400" y="56" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">deepscan-health :: mri-saliency-gradcam-res50.pth</text>

  <!-- Left Medical Scan Canvas -->
  <rect x="60" y="92" width="420" height="338" rx="8" fill="#080307" stroke="#2b1427" stroke-width="1"/>
  
  <!-- Stylized Anatomical Ribcage / Scan Outlines -->
  <g stroke="#4a1d46" stroke-width="2" fill="none" opacity="0.6">
    <ellipse cx="270" cy="240" rx="120" ry="140"/>
    <ellipse cx="270" cy="240" rx="80" ry="100"/>
    <ellipse cx="270" cy="240" rx="40" ry="60"/>
    <line x1="270" y1="100" x2="270" y2="380"/>
  </g>

  <!-- Saliency / Heatmap Overlay -->
  <ellipse cx="300" cy="220" rx="60" ry="50" fill="url(#heat-glow)"/>
  <rect x="250" y="170" width="100" height="100" rx="4" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="255" y="162" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ANOMALY: 99.1%</text>

  <!-- Right Diagnostics & Metric Cards -->
  <rect x="500" y="92" width="240" height="155" rx="8" fill="#240f20" stroke="#3e1a38" stroke-width="1"/>
  <text x="520" y="120" fill="#fdf2f8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Grad-CAM Attribution</text>
  <text x="520" y="145" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11">Sensitivity: 98.7%</text>
  <text x="520" y="170" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11">Specificity: 99.2%</text>
  <text x="520" y="195" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="11">F1-Score: 0.989</text>
  <rect x="520" y="210" width="200" height="22" rx="4" fill="#be185d" fill-opacity="0.3"/>
  <rect x="520" y="210" width="190" height="22" rx="4" fill="#e11d48"/>
  <text x="620" y="225" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">AUC-ROC 0.994</text>

  <!-- Model Meta -->
  <rect x="500" y="265" width="240" height="165" rx="8" fill="#240f20" stroke="#3e1a38" stroke-width="1"/>
  <text x="520" y="295" fill="#fdf2f8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Model Architecture</text>
  <text x="520" y="325" fill="#9d4edd" font-family="'JetBrains Mono', monospace" font-size="11">Backbone: ConvNeXt-L</text>
  <text x="520" y="350" fill="#9d4edd" font-family="'JetBrains Mono', monospace" font-size="11">Parameters: 198M</text>
  <text x="520" y="375" fill="#9d4edd" font-family="'JetBrains Mono', monospace" font-size="11">Inference: TensorRT</text>
  <rect x="520" y="390" width="200" height="26" rx="4" fill="#831843" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1"/>
  <text x="620" y="407" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">HIPAA COMPLIANT PIPELINE</text>
</svg>
