<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-p3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="chart-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="chart-emerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="16" fill="url(#bg-p3)"/>
  
  <!-- Frame Header -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="12" fill="#1e293b"/>
  <circle cx="65" cy="51" r="5.5" fill="#ef4444"/>
  <circle cx="85" cy="51" r="5.5" fill="#f59e0b"/>
  <circle cx="105" cy="51" r="5.5" fill="#10b981"/>
  <text x="400" y="56" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">omnipulse-cloud :: cluster-metrics.prod.sql [99.99% Uptime]</text>

  <!-- Metric Card 1 -->
  <rect x="60" y="90" width="210" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="80" y="116" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">QUERY THROUGHPUT</text>
  <text x="80" y="152" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">1.48M <tspan font-size="13" fill="#64748b">ops/sec</tspan></text>

  <!-- Metric Card 2 -->
  <rect x="295" y="90" width="210" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="315" y="116" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">P99 LATENCY</text>
  <text x="315" y="152" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">1.12ms <tspan font-size="13" fill="#10b981">↓ 14%</tspan></text>

  <!-- Metric Card 3 -->
  <rect x="530" y="90" width="210" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="550" y="116" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">CLUSTER NODES</text>
  <text x="550" y="152" fill="#a78bfa" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">64 Active</text>

  <!-- Chart Area -->
  <rect x="60" y="200" width="680" height="230" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="80" y="228" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Real-time Ingestion &amp; Replication Stream</text>
  
  <!-- Line 1 Area -->
  <path d="M80 380 Q140 320 220 340 T380 290 T520 250 T680 270 L680 410 L80 410 Z" fill="url(#chart-blue)"/>
  <path d="M80 380 Q140 320 220 340 T380 290 T520 250 T680 270" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Line 2 Area -->
  <path d="M80 395 Q140 370 220 360 T380 340 T520 300 T680 310" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 2"/>
</svg>
