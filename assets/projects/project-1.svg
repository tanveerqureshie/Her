    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="420" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="42" rx="12" fill="#1e293b"/>
  <circle cx="65" cy="51" r="5.5" fill="#ef4444"/>
  <circle cx="85" cy="51" r="5.5" fill="#f59e0b"/>
  <circle cx="105" cy="51" r="5.5" fill="#10b981"/>
  <text x="400" y="56" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">neuralvision-ai :: edge-yolov8-stream-01.feed [60 FPS]</text>

  <!-- Video Feed Simulation Canvas -->
  <rect x="60" y="92" width="460" height="338" rx="8" fill="#030712" stroke="#1f2937" stroke-width="1"/>
  
  <!-- Object Detection Bounding Box 1 -->
  <rect x="110" y="140" width="160" height="220" rx="4" fill="#06b6d4" fill-opacity="0.1" stroke="#00f2fe" stroke-width="2"/>
  <rect x="110" y="118" width="145" height="22" rx="3" fill="#00f2fe"/>
  <text x="118" y="133" fill="#030712" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">TARGET_01: VEHICLE (98.4%)</text>
  <line x1="190" y1="140" x2="190" y2="360" stroke="#00f2fe" stroke-width="1" stroke-dasharray="3 3"/>
  
  <!-- Object Detection Bounding Box 2 -->
  <rect x="310" y="180" width="120" height="190" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#a855f7" stroke-width="2"/>
  <rect x="310" y="158" width="135" height="22" rx="3" fill="#a855f7"/>
  <text x="318" y="173" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">PERSON_04 (96.8%)</text>
  
  <!-- Live Detection Target HUD Points -->
  <circle cx="190" cy="250" r="4" fill="#00f2fe"/>
  <circle cx="370" cy="260" r="4" fill="#a855f7"/>

  <!-- Right Panel Analytics -->
  <rect x="540" y="92" width="200" height="160" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="555" y="118" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Telemetry Stream</text>
  <text x="555" y="142" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">Inference Latency: 4.8ms</text>
  <text x="555" y="166" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">TensorRT Engine: FP16</text>
  <text x="555" y="190" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">IOU Threshold: 0.72</text>
  <rect x="555" y="206" width="170" height="30" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="640" y="226" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE TRACKING</text>

  <!-- Right Panel Waveform -->
  <rect x="540" y="270" width="200" height="160" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="555" y="296" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold">Confidence Dist.</text>
  <path d="M555 400 Q580 340 600 370 T640 330 T680 360 T720 320" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5"/>
  <path d="M555 400 Q580 340 600 370 T640 330 T680 360 T720 320 L720 410 L555 410 Z" fill="#06b6d4" fill-opacity="0.1"/>
